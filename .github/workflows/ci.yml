name: CI (Secrets + Tests)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_live_integration:
        description: "Run the 23 credential-gated tests against real OpenAI (billable, creates real files/batches)"
        type: boolean
        default: false
      target:
        description: "Relay to test: a fresh one built from this commit, or whatever is live on ai.lafiel.me"
        type: choice
        options: [local, deployed]
        default: local

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for better detection)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install and run the gitleaks binary directly instead of the
      # gitleaks/gitleaks-action Marketplace action. A third-party action is
      # rejected at startup unless it is on the repo's allowed-actions list,
      # which fails the whole run before any job executes. A plain `run:` step
      # uses only GitHub-owned actions and is always permitted.
      - name: Run Gitleaks (binary)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Resolve the latest linux_x64 asset dynamically so we don't break on
          # a version/naming change. jq is preinstalled on ubuntu-latest.
          URL="$(curl -sSL -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | jq -r '.assets[] | select(.name | test("linux_x64\\.tar\\.gz$")) | .browser_download_url' \
            | head -n1)"
          if [ -z "${URL}" ] || [ "${URL}" = "null" ]; then
            echo "Could not resolve gitleaks download URL from the releases API." >&2
            exit 1
          fi
          echo "Downloading gitleaks from: ${URL}"

          curl -sSL -o gitleaks.tar.gz "${URL}"
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks version

          # Scan committed history. Config must exist at repo root.
          ./gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --exit-code 1

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Rules and per-file ignores live in [tool.ruff] in pyproject.toml. The
      # selection is bug-focused (F/B/ASYNC/S/SIM/C4/PIE/RUF/T20/E402), not a
      # formatter — this gate fails on defects, never on layout.
      - name: Install ruff
        run: python -m pip install "ruff>=0.15,<1.0"

      - name: Run ruff
        run: ruff check app/ tests/ scripts/

  tests:
    name: Python Tests (pytest)
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.txt
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip

          # requirements-dev.txt is `-e .[dev]`: the runtime install plus pytest and
          # its plugins. requirements.txt is runtime-only because Render installs it.
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          elif [ -f pyproject.toml ]; then
            pip install ".[dev]"
          else
            echo "No requirements-dev.txt or pyproject.toml found; cannot install deps."
            exit 1
          fi

      - name: Run tests
        env:
          RELAY_AUTH_ENABLED: "false"
        run: |
          set -euo pipefail
          # In-process gate against the FastAPI app. The integration-marked tests
          # need a relay listening on a socket; the job below boots one.
          pytest -q -m "not integration"

      # These 37 tests were deselected on every CI run since the suite was
      # written, so 14 of them had never executed anywhere. They do not need
      # OpenAI credentials — only a relay on a socket — so boot one and run them.
      # The other 23 self-skip on INTEGRATION_OPENAI_API_KEY and stay skipped;
      # running those still requires a real key and a deliberate opt-in.
      - name: Start a local relay
        env:
          RELAY_KEY: ci-integration-key
          RELAY_AUTH_ENABLED: "true"
        run: |
          set -euo pipefail
          nohup python -m uvicorn app.main:app \
            --host 127.0.0.1 --port 8099 --log-level warning > uvicorn.log 2>&1 &
          # Poll rather than sleep: /v1/health is unauthenticated by design.
          for _ in $(seq 1 30); do
            if curl -fs -o /dev/null http://127.0.0.1:8099/v1/health; then
              echo "relay up"; exit 0
            fi
            sleep 1
          done
          echo "relay did not come up in 30s"; cat uvicorn.log; exit 1

      - name: Run integration tests against the local relay
        env:
          RELAY_BASE_URL: http://127.0.0.1:8099
          RELAY_BASE: http://127.0.0.1:8099
          RELAY_KEY: ci-integration-key
          RELAY_TOKEN: ci-integration-key
          RELAY_AUTH_TOKEN: ci-integration-key
        run: |
          set -euo pipefail
          pytest -q -m integration -rs

      - name: Relay log on failure
        if: failure()
        run: cat uvicorn.log || true

  # Manual only. These are the 23 tests the `tests` job leaves skipped: they make
  # real, billable OpenAI calls and create real artifacts upstream (16 POSTs across
  # /v1/files, /v1/uploads, /v1/batches, /v1/videos, /v1/fine_tuning/jobs). That is
  # why this is workflow_dispatch and not part of the PR gate — running it on every
  # push would bill the account and litter the org with test files.
  #
  # Requires two repo secrets (Settings -> Secrets and variables -> Actions):
  #   OPENAI_API_KEY  - a real key; the relay forwards with it
  #   RELAY_KEY       - the production relay key, to get past RelayAuthMiddleware
  #
  # target: "local" boots a relay here and points it at real OpenAI (safe-ish: the
  # relay under test is this commit). "deployed" runs against https://ai.lafiel.me,
  # which tests whatever Render currently has live, not necessarily this commit.
  integration-live:
    name: Integration (live OpenAI, manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_integration
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.txt
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Fail early if the required secrets are missing
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
        run: |
          set -euo pipefail
          # Without this the run would look like a pass: every test self-skips on a
          # missing key, and "0 failed" reads identically to "everything worked".
          missing=""
          [ -n "${OPENAI_API_KEY}" ] || missing="${missing} OPENAI_API_KEY"
          [ -n "${RELAY_KEY}" ]      || missing="${missing} RELAY_KEY"
          if [ -n "${missing}" ]; then
            echo "Missing required repo secret(s):${missing}" >&2
            echo "Add them under Settings -> Secrets and variables -> Actions." >&2
            exit 1
          fi
          echo "both secrets present"

      - name: Start a local relay against real OpenAI
        if: inputs.target == 'local'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
          RELAY_AUTH_ENABLED: "true"
          # The realtime WS proxy is enabled in production (render.yaml sets
          # RELAY_REALTIME_WS_ENABLED=1) but had never been exercised anywhere --
          # tests/test_realtime_ws_integration.py self-skipped on this flag. It has
          # to be set on BOTH the relay and the test: the relay rejects the upgrade
          # without it, and the test skips itself without it.
          RELAY_REALTIME_WS_ENABLED: "1"
        run: |
          set -euo pipefail
          nohup python -m uvicorn app.main:app \
            --host 127.0.0.1 --port 8099 --log-level warning > uvicorn.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fs -o /dev/null http://127.0.0.1:8099/v1/health; then
              echo "relay up"; exit 0
            fi
            sleep 1
          done
          echo "relay did not come up in 30s"; cat uvicorn.log; exit 1

      - name: Resolve the base URL
        id: base
        run: |
          set -euo pipefail
          if [ "${{ inputs.target }}" = "deployed" ]; then
            echo "url=https://ai.lafiel.me" >> "$GITHUB_OUTPUT"
          else
            echo "url=http://127.0.0.1:8099" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the credential-gated integration tests
        env:
          RELAY_BASE_URL: ${{ steps.base.outputs.url }}
          RELAY_BASE: ${{ steps.base.outputs.url }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
          RELAY_TOKEN: ${{ secrets.RELAY_KEY }}
          RELAY_AUTH_TOKEN: ${{ secrets.RELAY_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INTEGRATION_OPENAI_API_KEY: "1"
          RELAY_REALTIME_WS_ENABLED: "1"
        run: |
          set -euo pipefail
          echo "Target: ${RELAY_BASE_URL}"
          pytest -q -m integration -rs

      - name: Relay log on failure
        if: failure() && inputs.target == 'local'
        run: cat uvicorn.log || true

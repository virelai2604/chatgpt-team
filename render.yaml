# ==============================================================
# Render Service Manifest
# ChatGPT Team Relay — Ground Truth API v1.8
# SDK Targets:
#   - openai-python 3.x (HTTPX2)
#
# This file documents the live service. The service was created manually, so
# Render reads the dashboard, not this manifest — keep them in step by hand.
# Verified against the dashboard: Auto-Deploy "On Commit", branch main,
# build `pip install -r requirements.txt`, start `uvicorn app.main:app`.
# ==============================================================

services:
  - type: web
    name: chatgpt-team-relay
    runtime: python
    repo: https://github.com/virelai2604/chatgpt-team
    branch: main
    region: singapore
    plan: starter

    # BIFL: Use the current Blueprint field (replaces deprecated autoDeploy).
    # commit = redeploy on every push to the tracked branch (matches the live
    # dashboard setting "Auto-Deploy: On Commit").
    autoDeployTrigger: commit

    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt

    # Render requires binding to 0.0.0.0 and the PORT env var.
    startCommand: |
      uvicorn app.main:app --host 0.0.0.0 --port $PORT

    # Render health checks use GET and must return 2xx/3xx.
    healthCheckPath: /v1/health

    envVars:
      # -------- Core relay / app mode --------
      - key: APP_MODE
        value: production
      - key: ENVIRONMENT
        value: production

      # -------- OpenAI upstream config --------
      - key: OPENAI_API_BASE
        value: https://api.openai.com/v1

      - key: OPENAI_API_KEY
        sync: false

      - key: OPENAI_ASSISTANTS_BETA
        value: assistants=v2

      # -------- Auth (recommended ON for production) --------
      - key: RELAY_AUTH_ENABLED
        value: true

      - key: RELAY_KEY
        sync: false

      # -------- Default models --------
      - key: DEFAULT_MODEL
        value: gpt-5.5

      # -------- Relay identity / runtime --------
      - key: RELAY_HOST
        value: 0.0.0.0
      - key: RELAY_NAME
        value: ChatGPT Team Relay
      - key: RELAY_TIMEOUT
        value: "120"
      - key: PROXY_TIMEOUT
        value: "120"

      # Render uses this env var to select Python version (must be fully qualified here).
      # This mirrors the live dashboard value. The manually-created service reads
      # PYTHON_VERSION from the dashboard, not this file — to change the runtime,
      # edit the env var in Render (Environment tab), not just here.
      - key: PYTHON_VERSION
        value: "3.13"

      # -------- Streaming / orchestration --------
      - key: ENABLE_STREAM
        value: true
      - key: CHAIN_WAIT_MODE
        value: sequential

      # -------- CORS config (CSV, not JSON) --------
      - key: CORS_ALLOW_ORIGINS
        value: https://chat.openai.com,https://platform.openai.com
      - key: CORS_ALLOW_METHODS
        value: GET,POST,PUT,PATCH,DELETE,OPTIONS
      - key: CORS_ALLOW_HEADERS
        value: Authorization,Content-Type,Accept

      # VALIDATION_SCHEMA_PATH removed: no code reads it and the PDF it pointed
      # at is not in the repo.

      # -------- Vector store (app/routes/bifl.py) --------
      - key: BIFL_VECTOR_STORE_ID
        sync: false

      # -------- Logging --------
      - key: LOG_LEVEL
        value: info
      - key: LOG_FORMAT
        value: json
      - key: LOG_COLOR
        value: false

      # -------- Optional (Actions) --------
      - key: CHATGPT_ACTIONS_SECRET
        sync: false

version: "1"

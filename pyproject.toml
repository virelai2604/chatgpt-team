[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatgpt-team-relay"
version = "0.1.0"
description = "OpenAI-compatible relay server for ChatGPT Team (FastAPI + OpenAI Python SDK)."
readme = "docs/README.md"
requires-python = ">=3.12"

dependencies = [
  "fastapi>=0.138,<1.0",
  "uvicorn[standard]>=0.49,<1.0",
  # The relay's own outbound HTTP stack. This declaration is load-bearing: the
  # OpenAI SDK used to pull httpx in transitively, but since openai 3.0 it ships
  # httpx2 instead and installs neither httpx nor certifi.
  "httpx>=0.28,<1.0",

  # Official OpenAI Python SDK. The relay forwards via httpx (transparent proxy),
  # so the SDK is used only for the OpenAIError exception type in error handling.
  # openai 3.0 moved the SDK's own transport to HTTPX2. The relay never routes
  # traffic through the SDK, so the migration is a no-op here: no custom
  # http_client is injected, and no httpx object crosses an SDK boundary.
  "openai>=3.0,<4.0",

  "python-dotenv>=1.2,<2.0",
  "pydantic>=2.13,<3.0",
  "pydantic-settings>=2.14,<3.0",

  "python-multipart>=0.0.20,<0.1.0",
  # sse-starlette moved to a 3.x line; allow it (the relay uses Starlette's
  # StreamingResponse for SSE, so this dep is conservative headroom).
  "sse-starlette>=2.1,<5.0",

  "orjson>=3.11,<4.0",
  "pyyaml>=6.0,<7.0",
  "loguru>=0.7,<1.0",

]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10.0",
  "pytest-asyncio>=0.23,<2.0",
  "pytest-env>=1.1,<2.0",
  "pytest-httpx>=0.35,<1.0",
  "pytest-mock>=3.14,<4.0",
  "requests>=2.32,<3.0",
  "requests-mock>=1.12,<2.0",
  "anyio>=4.4,<5.0",
  "ruff>=0.15,<1.0",
]

[project.urls]
homepage = "https://github.com/virelai2604/chatgpt-team"
repository = "https://github.com/virelai2604/chatgpt-team"
issues = "https://github.com/virelai2604/chatgpt-team/issues"

# -----------------------------------------
# Setuptools: include ONLY app and app.*
# -----------------------------------------
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "docs*", "render*"]

# -----------------------------------------
# Ruff: bug-focused, not style-focused
# -----------------------------------------
# The selection is deliberately narrow. F/B/ASYNC/S/SIM/C4/PIE/RUF catch defects
# (undefined names, dead locals, swallowed exception causes, blocking calls in
# async paths, unsafe defaults); formatting rules are left out because nothing
# here reformats code and a churny diff hides the findings that matter.
#
# Pinning the selection also makes `# noqa: S104` and friends meaningful. With no
# config, the rule a noqa names is only enabled when someone passes --select for
# it, so ruff reports every one of them as an unused directive.
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# E402 is included for one reason: tests/client.py must set env vars before it
# imports the app, and the `# noqa: E402` marking that is only meaningful if the
# rule is on.
select = ["F", "B", "ASYNC", "S", "SIM", "C4", "PIE", "RUF", "T20", "E402"]

[tool.ruff.lint.per-file-ignores]
# Tests assert; that is the whole point. S101 flags every one of them.
"tests/**" = ["S101"]
# Scripts are CLIs. print() is their output, not a stray debug statement.
"scripts/**" = ["S101", "T201"]
# A runnable client demo that happens to live under tests/.
"tests/relay_client_example.py" = ["T201"]
"examples/**" = ["S101", "T201"]
